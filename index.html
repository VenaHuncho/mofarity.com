
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mofarity</title>

  <link rel="icon" type="image/png" href="mofarity-favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: white;
      background: #000;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* INDEPENDENT BACKGROUND */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      cursor: grab;
    }

    .background:active {
      cursor: grabbing;
    }

    .background img {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
      transform: translate3d(0, 0, 0) scale(1.2);
      transform-origin: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.40)
      );
      pointer-events: none;
    }

    /* PAGE CONTENT */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 35px 6%;
      gap: 30px;
      pointer-events: none;
    }

    /* HEADER */
    header {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* MAIN CONTENT */
    main {
      width: 50%;
      margin-left: auto;
      margin-top: auto;
      margin-bottom: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 25px 0;
    }

    h1 {
      font-size: clamp(45px, 7vw, 90px);
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      color: #24A9E0;
    }

    /* BY MOFARITY */
    .byline {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-top: 14px;
      color: #ffffff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    }

    /* MUSIC PLATFORMS */
    .music-platforms {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 38px;
    }

    .music-platforms a {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      pointer-events: auto;
    }

    .music-platforms a:hover {
      transform: scale(1.15);
    }

    .music-platforms svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* NATURAL BRAND COLORS */
    .spotify-icon {
      fill: #1DB954;
    }

    .youtube-music-icon {
      fill: #FF0000;
    }

    .youtube-icon {
      fill: #FF0000;
    }

    .music-platforms img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* BIOGRAPHY */
    .biography {
      display: inline-block;
      margin-top: 35px;
      padding: 13px 30px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      transition: all 0.25s ease;
      pointer-events: auto;
    }

    .biography:hover {
      background: white;
      color: black;
    }

    /* FOOTER */
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      font-size: 10px;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    footer a {
      color: white;
      text-decoration: none;
      transition: opacity 0.2s ease;
      pointer-events: auto;
    }

    footer a:hover {
      opacity: 0.65;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .page {
        padding: 25px 20px;
        gap: 25px;
      }

      header {
        font-size: 14px;
      }

      main {
        width: 100%;
        padding: 30px 0;
      }

      h1 {
        font-size: clamp(48px, 13vw, 75px);
        letter-spacing: -3px;
      }

      .byline {
        font-size: 13px;
        letter-spacing: 3px;
      }

      .music-platforms {
        gap: 18px;
        margin-top: 30px;
      }

      .music-platforms a {
        width: 34px;
        height: 34px;
      }

      footer {
        gap: 20px;
        font-size: 9px;
      }
    }

    /* LANDSCAPE / INVERTED PHONE */
    @media (max-height: 500px) {
      .page {
        justify-content: flex-start;
        gap: 20px;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      main {
        margin-top: 0;
        margin-bottom: 0;
        padding: 15px 0;
      }

      h1 {
        font-size: clamp(38px, 7vw, 65px);
      }

      .music-platforms {
        margin-top: 20px;
      }

      .biography {
        margin-top: 20px;
      }

      footer {
        margin-top: auto;
      }
    }
  </style>
</head>

  <!-- INDEPENDENT BACKGROUND DRAGGING -->
  <script>
    const background = document.getElementById("background");
    const bgImage = background.querySelector("img");

    let isDragging = false;
    let startX = 0;
    let startY = 0;

    let panX = 0;
    let panY = 0;

    function updateBackground() {
      const maxX = background.clientWidth * 0.10;
      const maxY = background.clientHeight * 0.10;

      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));

      bgImage.style.transform =
        `translate3d(${panX}px, ${panY}px, 0) scale(1.2)`;
    }

    background.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;

      isDragging = true;

      startX = event.clientX;
      startY = event.clientY;

      background.setPointerCapture(event.pointerId);
    });

    background.addEventListener("pointermove", (event) => {
      if (!isDragging) return;

      const deltaX = event.clientX - startX;
      const deltaY = event.clientY - startY;

      panX += deltaX;
      panY += deltaY;

      startX = event.clientX;
      startY = event.clientY;

      updateBackground();
    });

    function stopDragging() {
      isDragging = false;
    }

    background.addEventListener("pointerup", stopDragging);
    background.addEventListener("pointercancel", stopDragging);
    background.addEventListener("lostpointercapture", stopDragging);

    window.addEventListener("resize", updateBackground);
  </script>
