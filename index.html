<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:type" content="website">

  <title>Mofarity — GEEKIN'</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #080808;
      --muted: #777;
      --line: #e9e9e9;
      --page-width: 1440px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(100%, var(--page-width));
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 clamp(22px, 5.2vw, 76px);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(36px, 6vh, 72px) 0 clamp(42px, 7vh, 82px);
      text-align: center;
    }

    .hero-art {
      display: block;
      width: min(100%, 650px);
      margin: 0 auto;
      line-height: 0;
    }

    .hero-art img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin: clamp(24px, 3.4vw, 42px) 0 0;
      font-size: clamp(38px, 6.2vw, 76px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.055em;
    }

    .byline {
      margin: 13px 0 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .streaming {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(22px, 3.5vw, 42px);
      margin-top: clamp(28px, 4vw, 44px);
    }

    .platform {
      width: 31px;
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #080808;
      transition: opacity .2s ease, transform .2s ease;
    }

    .platform:hover {
      opacity: .58;
      transform: translateY(-3px);
    }

    .platform svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .biography {
      display: inline-block;
      margin-top: clamp(28px, 4vw, 42px);
      padding: 14px 25px;
      border: 1px solid #111;
      border-radius: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: background .2s ease, color .2s ease;
    }

    .biography:hover {
      background: #080808;
      color: #fff;
    }

    footer {
      min-height: 94px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 5vw, 64px);
      padding: 24px 0;
    }

    .footer-link {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity .2s ease;
    }

    .footer-link:hover { opacity: .5; }

    @media (min-width: 1000px) {
      .hero-art { width: min(49vw, 650px); }
    }

    @media (max-width: 560px) {
      .page { padding: 0 20px; }
      .topbar { min-height: 70px; }
      main { padding: 38px 0 48px; }
      .hero-art { width: min(100%, 440px); }
      h1 { margin-top: 25px; font-size: clamp(42px, 12vw, 60px); }
      .streaming { gap: 25px; margin-top: 30px; }
      .platform { width: 29px; height: 29px; }
      footer {
        min-height: 82px;
        gap: 20px;
        flex-wrap: wrap;
        padding: 22px 0;
      }
      .footer-link { font-size: 10px; letter-spacing: .1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
