
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Mofarity</title>

  <meta name="description" content="GEEKIN' by Mofarity. Listen now.">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="mofarity-favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.35)
        ),
        url("mofarity-background.jpg") center center / cover no-repeat;
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 35px 5%;
    }

    /* HEADER */

    header {
      text-align: center;
    }

    .logo-text {
      color: white;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 5px;
      text-decoration: none;
    }

    /* MAIN CONTENT */

    main {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      width: 50%;
    }

    h1 {
      font-size: clamp(45px, 7vw, 90px);
      font-weight: 900;
      letter-spacing: -4px;
    }

    .byline {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-top: 12px;
    }

    /* MUSIC PLATFORM ICONS */

    .music-platforms {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-top: 35px;
    }

    .music-platforms a {
      display: flex;
      width: 38px;
      height: 38px;
      transition: transform 0.2s ease;
    }

    .music-platforms a:hover {
      transform: scale(1.15);
    }

    .music-platforms svg {
      width: 100%;
      height: 100%;
    }

    /* BIOGRAPHY */

    .biography {
      display: inline-block;
      margin-top: 38px;
      padding: 15px 30px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.2s;
    }

    .biography:hover {
      background: white;
      color: black;
    }

    /* FOOTER */

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    footer a:hover {
      opacity: 0.65;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        padding: 25px 18px;
      }

      body {
        background-position: 42% center;
      }

      main {
        width: 100%;
        margin: 0;
      }

      h1 {
        font-size: 58px;
      }

      .music-platforms {
        gap: 24px;
      }

      .music-platforms a {
        width: 34px;
        height: 34px;
      }

      footer {
        gap: 22px;
      }

      footer a {
        font-size: 9px;
        letter-spacing: 0.5px;
      }
    }

  </style>
</head>
