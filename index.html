
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>MOFARITY</title>

  <link rel="icon" type="image/png" href="./mofarity-favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    /* VIDEO BACKGROUND */
    .video-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* DARK OVERLAY */
    .video-background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
    }

    /* PORTRAIT VIDEO ON DESKTOP */
    @media (min-width: 701px) {
      .video-background video {
        width: auto;
        height: 100%;
        aspect-ratio: 9 / 16;
        object-fit: cover;
      }
    }

    /* PHONE ROTATED TO LANDSCAPE:
       Counter-rotate the video to keep its portrait orientation.
       The text layer is not rotated. */
    @media (max-width: 700px) and (orientation: landscape) {
      .video-background video {
        position: absolute;
        width: 100vh;
        height: 100vw;
        max-width: none;
        max-height: none;
        object-fit: cover;
        transform: rotate(90deg);
      }
    }

    /* WEBSITE CONTENT */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 6%;
      overflow: hidden;
    }

    /* HEADER */
    header {
      flex-shrink: 0;
    }

    .logo {
      color: #fff;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 4px;
      text-decoration: none;
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .content {
      width: min(100%, 480px);
      text-align: center;
    }

    h1 {
      color: #24A9E0;
      font-size: clamp(55px, 10vw, 105px);
      font-weight: 1000;
      line-height: 0.95;
      letter-spacing: -5px;
    }

    .byline {
      margin-top: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 7px;
    }

    /* MUSIC LINKS */
    .music-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin: 35px 0;
    }

    .music-links a {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .music-links a:hover {
      transform: scale(1.15);
    }

    .music-links svg {
      width: 37px;
      height: 37px;
      display: block;
    }

    .spotify {
      color: #1DB954;
    }

    .youtube,
    .youtube-music {
      color: #FF0000;
    }

    .boomplay {
      color: #fff;
    }

    /* BIOGRAPHY BUTTON */
    .bio-button {
      display: inline-block;
      padding: 13px 34px;
      border: 2px solid #fff;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      transition: all 0.25s ease;
    }

    .bio-button:hover {
      background: #fff;
      color: #000;
    }

    /* FOOTER */
    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 12px 0 5px;
    }

    footer a {
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.65;
    }

    /* PHONE PORTRAIT */
    @media (max-width: 700px) and (orientation: portrait) {
      .page {
        padding: 25px 7%;
      }

      main {
        justify-content: center;
      }

      .content {
        width: 100%;
      }

      h1 {
        font-size: clamp(52px, 15vw, 85px);
        letter-spacing: -3px;
      }

      .music-links {
        gap: 20px;
        margin: 30px 0;
      }

      footer {
        gap: 20px;
      }
    }

    /* PHONE LANDSCAPE: FIT CONTENT WITHOUT SCROLLING */
    @media (max-width: 700px) and (orientation: landscape) {
      .page {
        padding: 10px 5%;
      }

      .logo {
        font-size: 18px;
      }

      main {
        justify-content: center;
      }

      .content {
        width: min(100%, 430px);
      }

      h1 {
        font-size: clamp(35px, 8vw, 58px);
        letter-spacing: -2px;
      }

      .byline {
        margin-top: 7px;
        font-size: 10px;
        letter-spacing: 5px;
      }

      .music-links {
        gap: 17px;
        margin: 14px 0;
      }

      .music-links a {
        width: 36px;
        height: 36px;
      }

      .music-links svg {
        width: 29px;
        height: 29px;
      }

      .bio-button {
        padding: 8px 22px;
        font-size: 10px;
      }

      footer {
        gap: 18px;
        padding: 5px 0 2px;
      }

      footer a {
        font-size: 9px;
      }
    }

    /* SHORT SCREENS */
    @media (max-height: 420px) {
      .page {
        padding-top: 7px;
        padding-bottom: 7px;
      }

      .music-links {
        margin: 8px 0;
      }

      .byline {
        margin-top: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- INDEPENDENT VIDEO LAYER -->
  <div class="video-background">
    <video
      id="backgroundVideo"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="./mofarity-background.jpg"
    >
      <source src="./mofarity-background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- WEBSITE CONTENT LAYER -->
  <div class="page">

    <header>
      <a class="logo" href="#">MOFARITY</a>
    </header>

    <main>
      <section class="content">

        <h1>GEEKIN'</h1>
        <p class="byline">BY MOFARITY</p>

        <div class="music-links">

          <!-- SPOTIFY -->
          <a class="spotify"
             href="https://open.spotify.com/album/5nS7kijukEgPS9v8eAyZOo"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="Spotify">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.49 17.31a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.57-1.04 8.49-.59 11.66 1.34.36.22.47.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.99-8.16-2.57-11.98-1.41a.94.94 0 1 1-.55-1.8c4.37-1.33 9.8-.69 13.51 1.6.44.27.58.85.31 1.3zm.13-3.4C15.22 8.28 8.8 8.07 5.08 9.2a1.13 1.13 0 1 1-.66-2.17c4.27-1.3 11.36-1.05 15.84 1.6a1.13 1.13 0 0 1-1.17 2z"/>
            </svg>
          </a>

          <!-- YOUTUBE MUSIC -->
          <a class="youtube-music"
             href="https://music.youtube.com/playlist?list=OLAK5uy_nkIMdv6o7lps0Z6JBtVtE2mZBW9Q8tPRQ&si=SSeKr0hLfaS0Itoa"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="YouTube Music">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm0 21.6A9.6 9.6 0 1 1 12 2.4a9.6 9.6 0 0 1 0 19.2zm-2.4-14v12.8l8-6.4-8-6.4z"/>

          <!-- BOOMPLAY -->
          <a class="boomplay"

            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm-2.5 16V7l8 5-8 5z"/>
            </svg>
          </a>

          <!-- YOUTUBE -->
          <a class="youtube"
             href="https://youtube.com/playlist?list=OLAK5uy_kmaTIvjvevv5PS1iWxwcu6CXmmA33wx9o&si=5tZrEeAklRuTOw5m"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/>
            </svg>
          </a>

        </div>

        <a class="bio-button"
           href="https://hyperfollow.com/mofarity"
           target="_blank"
           rel="noopener noreferrer">
          BIOGRAPHY
        </a>

      </section>
    </main>

    <footer>
      <a href="https://facebook.com/mofarity"
         target="_blank"
         rel="noopener noreferrer">FACEBOOK</a>

      <a href="https://whatsapp.com/channel/0029Vb8NzSf1t90V2XDCcm1Z"
         target="_blank"
         rel="noopener noreferrer">WHATSAPP CHANNEL</a>

      <a href="mailto:book@mofarity.com">BOOK</a>
    </footer>

  </div>

  <!-- VIDEO PLAYBACK -->
  <script>
    const video = document.getElementById("backgroundVideo");

    function startVideo() {
      video.muted = true;
      video.play().catch(() => {
        console.log("Waiting for video playback permission.");
      });
    }

    video.addEventListener("canplay", startVideo);
    window.addEventListener("load", startVideo);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && video.paused) {
        startVideo();
      }
    });
  </script>

</body>
</html>
